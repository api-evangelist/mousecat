aid: mousecat
name: MouseCat
description: >-
  MouseCat is an agentic AI infrastructure company for risk operations, founded in 2026 and
  a graduate of the Y Combinator Winter 2026 batch. The platform runs human-quality fraud
  investigations to help risk teams automatically detect, investigate, and mitigate emerging
  fraud, scale investigations, build better models, and make faster decisions. MouseCat deploys
  entirely within customer-owned cloud environments, integrating with the data, vendors, and
  APIs a risk team already relies on so companies retain complete control of sensitive data.
  The company was founded by Nicholas Aldridge (CEO) and Joseph McAllister (CTO) and is backed
  by Y Combinator, Imagination Capital, and SurgePoint Capital. As of this profile MouseCat is
  an early-stage startup with a public marketing site and a private application; it publishes
  no public API, SDK, developer documentation, or MCP server yet.
